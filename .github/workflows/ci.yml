name: Continuous Integration

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  
jobs:
  unit_tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Graphics Libs Please
        run: |
          sudo apt update -y
          sudo apt install -y \
            libegl1-mesa-dev \
            mesa-utils \
            libx11-dev
      - name: Setup Conan Client
        uses: conan-io/setup-conan@v1
      - name: Install Dependencies
        run: conan install . --build=missing --conf tools.system.package_manager:mode=install
      - name: Build Project
        run: |
          cmake --preset conan-release
          cmake --build --preset conan-release
      - name: Run Unit Tests
        run: ctest --preset conan-release
  
  test_install_on_linux:
    name: Install on Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Conan Client
        uses: conan-io/setup-conan@v1
      - name: Run install script
        run: sudo ./gimmeit.sh

  test_install_on_mac:
    name: Install on Mac
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - name: Setup Conan Client
        uses: conan-io/setup-conan@v1
      - name: Run install script
        run: sudo ./gimmeit.sh
